<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src umbra: data:;">
  <title>Page not available</title>
  <link rel="stylesheet" href="page.css">
  <style>
    body { visibility: hidden; display: grid; place-items: center; }
    .box { width: min(520px, 88vw); margin-top: -6vh; }
    .glyph { width: 56px; height: 56px; opacity: 0.6; margin-bottom: 20px; }
    h1 { font-size: 21px; }
    .addr { font-family: var(--mono); font-size: 12.5px; color: var(--faint);
            word-break: break-all; margin: 4px 0 22px; }
    .why { color: var(--muted); margin-bottom: 26px; }
    .actions { display: flex; gap: 10px; }
    .code { margin-top: 26px; color: var(--faint); font-size: 12px; font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="box">
    <img class="glyph" src="umbra://assets/mark.png" alt="">
    <h1 id="headline">This page could not be loaded</h1>
    <div class="addr" id="addr"></div>
    <p class="why" id="why"></p>
    <div class="actions">
      <button class="action" id="retry">Try again</button>
      <button class="action" id="home">Go to a new tab</button>
    </div>
    <div class="code" id="code"></div>
  </div>

  <script src="page.js"></script>
  <script src="error.js"></script>
</body>
</html>
