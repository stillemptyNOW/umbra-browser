<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src umbra: data:;">
  <title>Umbra settings</title>
  <link rel="icon" href="umbra://assets/favicon.png">
  <link rel="stylesheet" href="page.css">
  <style>
    body { visibility: hidden; }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .head img { width: 40px; height: 40px; }
    .sites { max-height: 320px; overflow-y: auto; }
    .sites .row { padding: 10px 18px; }
    .sites .host { flex: 1; }
    .sites .visits { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; }
    .empty { padding: 18px; color: var(--faint); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 14px; }
    .chip { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
    .chip:hover { background: var(--hover); }
    .chip.active { border-color: var(--accent); }
    .chip .sw { display: flex; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); flex: none; }
    .chip .sw i { width: 10px; height: 20px; }
    .credit { padding: 0 14px 14px; color: var(--faint); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <img src="umbra://assets/mark-glow.png" alt="">
      <div>
        <h1>Settings</h1>
        <p class="lead" id="sub" style="margin:0"></p>
      </div>
    </div>

    <div id="sections"></div>

    <h2>Appearance</h2>
    <div class="card">
      <div class="grid" id="themes"></div>
      <div class="credit" id="themeCredit"></div>
    </div>

    <h2>Sites you have visited</h2>
    <div class="card sites" id="sites"></div>

    <h2>Clear data</h2>
    <div class="card">
      <div class="row">
        <div class="txt"><b>Clear everything</b><span>Cookies, storage, cache and local history for this profile.</span></div>
        <button class="action danger" id="clearAll">Clear now</button>
      </div>
      <div class="row">
        <div class="txt"><b>Clear on exit</b><span>Wipe the profile automatically every time Umbra quits.</span></div>
        <button class="switch" role="switch" id="clearOnExit"></button>
      </div>
    </div>
  </div>

  <script src="page.js"></script>
  <script src="settings.js"></script>
</body>
</html>
